events {
    worker_connections 1024;
}

http {

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time us=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    upstream ui_service {
        server ui-service:80;
        keepalive 32;
    }

    upstream user_service {
        server user-service:3001;
        keepalive 32;
    }

    upstream order_service {
        server order-service:3002;
        keepalive 32;
    }

    upstream inventory_service {
        server inventory-service:3003;
        keepalive 32;
    }

    upstream payment_service {
        server payment-service:3004;
        keepalive 32;
    }

    upstream analytics_service {
        server analytics-service:3005;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Gateway health ────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ── User Service ──────────────────────────────────────
        location /api/users {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://user_service/users/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Order Service ─────────────────────────────────────
        location /api/orders {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://order_service/orders/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Inventory Service ─────────────────────────────────
        location /api/products {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://inventory_service/products;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Payment Service ───────────────────────────────────
        location /api/payments {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://payment_service/payments;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Analytics Service ─────────────────────────────────
        location /api/analytics {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://analytics_service/analytics;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── UI Service — catch-all ────────────────────────────
        location / {
            proxy_pass         http://ui_service;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Error pages ───────────────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            return 429 '{"error":"Too many requests"}';
            add_header Content-Type application/json;
        }

        error_page 502 503 504 /5xx.json;
        location = /5xx.json {
            return 503 '{"error":"Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}