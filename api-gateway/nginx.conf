events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time us=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    upstream ui_service {
        server ui-service:3000;
        keepalive 32;
    }

    upstream auth_service {
        server auth-service:3006;
        keepalive 32;
    }

    upstream user_service {
        server user-service:3001;
        keepalive 32;
    }

    upstream order_service {
        server order-service:3002;
        keepalive 32;
    }

    upstream inventory_service {
        server inventory-service:3003;
        keepalive 32;
    }

    upstream payment_service {
        server payment-service:3004;
        keepalive 32;
    }

    upstream analytics_service {
        server analytics-service:3005;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location /auth {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location = /_auth_validate {
            internal;
            proxy_pass              http://auth_service/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_set_header        Authorization $http_authorization;
        }

        location /api/users {
            auth_request /_auth_validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role  $upstream_http_x_user_role;
            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/users(/.*)? /users$1 break;
            proxy_pass         http://user_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_set_header   X-User-ID    $user_id;
            proxy_set_header   X-User-Email $user_email;
            proxy_set_header   X-User-Role  $user_role;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location /api/orders {
            auth_request /_auth_validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role  $upstream_http_x_user_role;
            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/orders(/.*)? /orders/$1 break;
            proxy_pass         http://order_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_set_header   X-User-ID    $user_id;
            proxy_set_header   X-User-Email $user_email;
            proxy_set_header   X-User-Role  $user_role;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location /api/products {
            auth_request /_auth_validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role  $upstream_http_x_user_role;
            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/products(/.*)? /products$1 break;
            proxy_pass         http://inventory_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_set_header   X-User-ID    $user_id;
            proxy_set_header   X-User-Email $user_email;
            proxy_set_header   X-User-Role  $user_role;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location /api/payments {
            auth_request /_auth_validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role  $upstream_http_x_user_role;
            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/payments(/.*)? /payments$1 break;
            proxy_pass         http://payment_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_set_header   X-User-ID    $user_id;
            proxy_set_header   X-User-Email $user_email;
            proxy_set_header   X-User-Role  $user_role;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location /api/analytics {
            auth_request /_auth_validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role  $upstream_http_x_user_role;
            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/analytics(/.*)? /analytics$1 break;
            proxy_pass         http://analytics_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $request_id;
            proxy_set_header   X-User-ID    $user_id;
            proxy_set_header   X-User-Email $user_email;
            proxy_set_header   X-User-Role  $user_role;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location @unauthorized {
            return 401 '{"error":"Unauthorized — valid JWT token required"}';
            add_header Content-Type application/json;
        }

        location @forbidden {
            return 403 '{"error":"Forbidden — insufficient permissions"}';
            add_header Content-Type application/json;
        }

        location / {
            proxy_pass         http://ui_service;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        error_page 429 /429.json;
        location = /429.json {
            return 429 '{"error":"Too many requests"}';
            add_header Content-Type application/json;
        }

        error_page 502 503 504 /5xx.json;
        location = /5xx.json {
            return 503 '{"error":"Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}