name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:

  # ── Detect changed services ───────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      user-service:         ${{ steps.changes.outputs.user-service }}
      order-service:        ${{ steps.changes.outputs.order-service }}
      inventory-service:    ${{ steps.changes.outputs.inventory-service }}
      payment-service:      ${{ steps.changes.outputs.payment-service }}
      analytics-service:    ${{ steps.changes.outputs.analytics-service }}
      auth-service:         ${{ steps.changes.outputs.auth-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      api-gateway:          ${{ steps.changes.outputs.api-gateway }}
      ui-service:           ${{ steps.changes.outputs.ui-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            user-service:
              - 'user-service/**'
            order-service:
              - 'order-service/**'
            inventory-service:
              - 'inventory-service/**'
            payment-service:
              - 'payment-service/**'
            analytics-service:
              - 'analytics-service/**'
            auth-service:
              - 'auth-service/**'
            notification-service:
              - 'notification-service/**'
            api-gateway:
              - 'api-gateway/**'
            ui-service:
              - 'ui-service/**'

  # ── User Service ──────────────────────────────────────────────
  user-service:
    name: User Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.user-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: user-service/package-lock.json

      - name: Install dependencies
        working-directory: user-service
        run: npm ci

      - name: Lint
        working-directory: user-service
        run: npm run lint --if-present || true

      - name: Test
        working-directory: user-service
        run: npm test --if-present || true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/user-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/user-service:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── Order Service ─────────────────────────────────────────────
  order-service:
    name: Order Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.order-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: order-service
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: order-service
        run: pip install flake8 && flake8 . --max-line-length=120 --exclude=__pycache__ || true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/order-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/order-service:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── Inventory Service ─────────────────────────────────────────
  inventory-service:
    name: Inventory Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.inventory-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: inventory-service/go.sum

      - name: Install dependencies
        working-directory: inventory-service
        run: go mod download

      - name: Lint
        working-directory: inventory-service
        run: go vet ./...

      - name: Test
        working-directory: inventory-service
        run: go test ./... || true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./inventory-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/inventory-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/inventory-service:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── Payment Service ───────────────────────────────────────────
  payment-service:
    name: Payment Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.payment-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        working-directory: payment-service
        run: mvn clean verify -DskipTests=true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/payment-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/payment-service:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── Analytics Service ─────────────────────────────────────────
  analytics-service:
    name: Analytics Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql

      - name: Install dependencies
        working-directory: analytics-service
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Lint
        working-directory: analytics-service
        run: vendor/bin/pint --test || true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/analytics-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/analytics-service:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── Auth Service ──────────────────────────────────────────────
  auth-service:
    name: Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: auth-service
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: auth-service
        run: pip install flake8 && flake8 . --max-line-length=120 --exclude=__pycache__ || true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/auth-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/auth-service:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── Notification Service ──────────────────────────────────────
  notification-service:
    name: Notification Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.notification-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: notification-service
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: notification-service
        run: pip install flake8 && flake8 . --max-line-length=120 --exclude=__pycache__ || true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/notification-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/notification-service:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── API Gateway ───────────────────────────────────────────────
  api-gateway:
    name: API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Validate nginx config
        run: |
          docker run --rm \
            -v $(pwd)/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:1.25 nginx -t

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/api-gateway:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/api-gateway:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── UI Service ────────────────────────────────────────────────
  ui-service:
    name: UI Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Validate nginx config
        run: |
          docker run --rm \
            -v $(pwd)/ui-service/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.25-alpine nginx -t

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: ./ui-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/ui-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/ui-service:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

  # ── Pipeline Summary ──────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      - user-service
      - order-service
      - inventory-service
      - payment-service
      - analytics-service
      - auth-service
      - notification-service
      - api-gateway
      - ui-service
    if: always()
    steps:
      - name: Summary
        run: |
          echo "════════════════════════════════════"
          echo "  Pipeline Summary"
          echo "════════════════════════════════════"
          echo "Branch:  ${{ github.ref_name }}"
          echo "SHA:     ${{ github.sha }}"
          echo "Trigger: ${{ github.event_name }}"
          echo ""
          if [[ "${{ github.ref }}" == "refs/heads/develop" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Images pushed to Docker Hub"
          else
            echo "PR/feature branch — images not pushed"
          fi