name: CI — Build and Test

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main

jobs:

  # ── Detect changed services ──────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      user-service:         ${{ steps.changes.outputs.user-service }}
      order-service:        ${{ steps.changes.outputs.order-service }}
      inventory-service:    ${{ steps.changes.outputs.inventory-service }}
      payment-service:      ${{ steps.changes.outputs.payment-service }}
      analytics-service:    ${{ steps.changes.outputs.analytics-service }}
      auth-service:         ${{ steps.changes.outputs.auth-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      api-gateway:          ${{ steps.changes.outputs.api-gateway }}
      ui-service:           ${{ steps.changes.outputs.ui-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            user-service:
              - 'user-service/**'
            order-service:
              - 'order-service/**'
            inventory-service:
              - 'inventory-service/**'
            payment-service:
              - 'payment-service/**'
            analytics-service:
              - 'analytics-service/**'
            auth-service:
              - 'auth-service/**'
            notification-service:
              - 'notification-service/**'
            api-gateway:
              - 'api-gateway/**'
            ui-service:
              - 'ui-service/**'

  # ── User Service ──────────────────────────────────────────────
  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.user-service == 'true'
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: user-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present
      - name: Build Docker image
        run: docker build -t user-service:ci .

  # ── Order Service ─────────────────────────────────────────────
  test-order-service:
    name: Test Order Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.order-service == 'true'
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: pip install flake8 && flake8 . --max-line-length=120 --exclude=__pycache__ --if-present || true
      - name: Build Docker image
        run: docker build -t order-service:ci .

  # ── Inventory Service ─────────────────────────────────────────
  test-inventory-service:
    name: Test Inventory Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.inventory-service == 'true'
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: inventory-service/go.sum
      - name: Install dependencies
        run: go mod download
      - name: Lint
        run: go vet ./...
      - name: Test
        run: go test ./... -v --if-present || true
      - name: Build Docker image
        run: docker build -t inventory-service:ci .

  # ── Payment Service ───────────────────────────────────────────
  test-payment-service:
    name: Test Payment Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.payment-service == 'true'
    defaults:
      run:
        working-directory: payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and test
        run: mvn clean verify -DskipTests=false
      - name: Build Docker image
        run: docker build -t payment-service:ci .

  # ── Analytics Service ─────────────────────────────────────────
  test-analytics-service:
    name: Test Analytics Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics-service == 'true'
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint
        run: vendor/bin/pint --test || true
      - name: Build Docker image
        run: docker build -t analytics-service:ci .

  # ── Auth Service ──────────────────────────────────────────────
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: pip install flake8 && flake8 . --max-line-length=120 --exclude=__pycache__ || true
      - name: Build Docker image
        run: docker build -t auth-service:ci .

  # ── Notification Service ──────────────────────────────────────
  test-notification-service:
    name: Test Notification Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.notification-service == 'true'
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: pip install flake8 && flake8 . --max-line-length=120 --exclude=__pycache__ || true
      - name: Build Docker image
        run: docker build -t notification-service:ci .

  # ── API Gateway ───────────────────────────────────────────────
  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Validate nginx config
        run: |
          docker run --rm \
            -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:1.25 nginx -t
      - name: Build Docker image
        run: docker build -t api-gateway:ci .

  # ── UI Service ────────────────────────────────────────────────
  test-ui-service:
    name: Test UI Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui-service == 'true'
    defaults:
      run:
        working-directory: ui-service
    steps:
      - uses: actions/checkout@v4
      - name: Validate nginx config
        run: |
          docker run --rm \
            -v $(pwd)/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.25-alpine nginx -t
      - name: Build Docker image
        run: docker build -t ui-service:ci .

  # ── CI Summary ────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - test-user-service
      - test-order-service
      - test-inventory-service
      - test-payment-service
      - test-analytics-service
      - test-auth-service
      - test-notification-service
      - test-api-gateway
      - test-ui-service
    if: always()
    steps:
      - name: Check results
        run: |
          echo "CI Pipeline completed"
          echo "All changed services validated"