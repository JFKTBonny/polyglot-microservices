name: CD — Build and Push Images

on:
  push:
    branches:
      - develop

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  SHA: ${{ github.sha }}

jobs:

  # ── Detect changed services ───────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      user-service:         ${{ steps.changes.outputs.user-service }}
      order-service:        ${{ steps.changes.outputs.order-service }}
      inventory-service:    ${{ steps.changes.outputs.inventory-service }}
      payment-service:      ${{ steps.changes.outputs.payment-service }}
      analytics-service:    ${{ steps.changes.outputs.analytics-service }}
      auth-service:         ${{ steps.changes.outputs.auth-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      api-gateway:          ${{ steps.changes.outputs.api-gateway }}
      ui-service:           ${{ steps.changes.outputs.ui-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            user-service:
              - 'user-service/**'
            order-service:
              - 'order-service/**'
            inventory-service:
              - 'inventory-service/**'
            payment-service:
              - 'payment-service/**'
            analytics-service:
              - 'analytics-service/**'
            auth-service:
              - 'auth-service/**'
            notification-service:
              - 'notification-service/**'
            api-gateway:
              - 'api-gateway/**'
            ui-service:
              - 'ui-service/**'

  # ── Login to Docker Hub ───────────────────────────────────────
  docker-login:
    name: Docker Hub Login
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  # ── Build and push each service ───────────────────────────────
  build-user-service:
    name: Build User Service
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.user-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/user-service:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/user-service:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-order-service:
    name: Build Order Service
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.order-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/order-service:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/order-service:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-inventory-service:
    name: Build Inventory Service
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.inventory-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./inventory-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/inventory-service:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/inventory-service:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-payment-service:
    name: Build Payment Service
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.payment-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/payment-service:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/payment-service:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-analytics-service:
    name: Build Analytics Service
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.analytics-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/analytics-service:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/analytics-service:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-auth-service:
    name: Build Auth Service
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.auth-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/auth-service:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/auth-service:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-notification-service:
    name: Build Notification Service
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.notification-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/notification-service:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/notification-service:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api-gateway:
    name: Build API Gateway
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.api-gateway == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/api-gateway:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/api-gateway:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ui-service:
    name: Build UI Service
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-login]
    if: needs.detect-changes.outputs.ui-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./ui-service
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/ui-service:${{ env.SHA }}
            ${{ env.DOCKER_USERNAME }}/ui-service:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── CD Summary ────────────────────────────────────────────────
  cd-summary:
    name: CD Summary
    runs-on: ubuntu-latest
    needs:
      - build-user-service
      - build-order-service
      - build-inventory-service
      - build-payment-service
      - build-analytics-service
      - build-auth-service
      - build-notification-service
      - build-api-gateway
      - build-ui-service
    if: always()
    steps:
      - name: Summary
        run: |
          echo "CD Pipeline completed"
          echo "Images pushed to Docker Hub"
          echo "SHA: ${{ github.sha }}"