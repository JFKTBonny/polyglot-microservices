name: Security Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2am
  workflow_dispatch:

jobs:

  # ── Secret Detection ──────────────────────────────────────────
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scanning

      - name: GitLeaks — scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency Scanning ───────────────────────────────────────
  dependency-scan-node:
    name: Dependency Scan — Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit
        working-directory: user-service
        run: |
          npm ci
          npm audit --audit-level=high || true

  dependency-scan-python:
    name: Dependency Scan — Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, auth-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip audit
        working-directory: ${{ matrix.service }}
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit --requirement requirements.txt || true

  dependency-scan-go:
    name: Dependency Scan — Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: govulncheck
        working-directory: inventory-service
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  dependency-scan-java:
    name: Dependency Scan — Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: OWASP Dependency Check
        working-directory: payment-service
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DskipTestScope=true || true

  dependency-scan-php:
    name: Dependency Scan — PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Create Laravel directories
        working-directory: analytics-service
        run: |
          mkdir -p bootstrap/cache storage/framework/sessions \
                   storage/framework/views storage/framework/cache \
                   storage/logs
      - name: Install dependencies
        working-directory: analytics-service
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs
      - name: Local PHP Security Checker
        working-directory: analytics-service
        run: |
          composer require --dev enlightn/security-checker || true
          php vendor/bin/security-checker security:check || true

  # ── SAST ─────────────────────────────────────────────────────
  sast-python:
    name: SAST — Python (Bandit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, auth-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bandit security scan
        working-directory: ${{ matrix.service }}
        run: |
          pip install bandit
          bandit -r . \
            --exclude .venv,myenv,venv \
            --severity-level medium \
            -f json \
            -o bandit-report.json || true
          bandit -r . \
            --exclude .venv,myenv,venv \
            --severity-level medium || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report-${{ matrix.service }}
          path: ${{ matrix.service }}/bandit-report.json

  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/python
            p/javascript
            p/java
            p/go
            p/php
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  codeql:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false    # ← don't cancel other languages on failure
      matrix:
        language: [javascript, python, go, java]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup Java (only for java)
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Java manually
        if: matrix.language == 'java'
        working-directory: payment-service
        run: mvn clean package -DskipTests=true

      - name: Autobuild (non-java)
        if: matrix.language != 'java'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
  # ── Container Scanning ────────────────────────────────────────
  container-scan:
    name: Container Scan — Trivy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - order-service
          - inventory-service
          - payment-service
          - analytics-service
          - auth-service
          - notification-service
          - api-gateway
          - ui-service
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t ${{ matrix.service }}:scan ./${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ── Infrastructure Scanning ───────────────────────────────────
  infra-scan:
    name: Infrastructure Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov — K8s manifest scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: feature/k8s/
          framework: kubernetes
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-k8s.sarif
        continue-on-error: true

      - name: Upload Checkov report
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov-k8s.sarif') != ''
        with:
          sarif_file: checkov-k8s.sarif
          category: checkov-kubernetes

      - name: Checkov — Docker Compose scan
        uses: bridgecrewio/checkov-action@master
        with:
          file: docker-compose.yaml
          framework: dockerfile
          soft_fail: true

  # ── Docker Compose Security ───────────────────────────────────
  dockerfile-scan:
    name: Dockerfile Scan — Hadolint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - order-service
          - inventory-service
          - payment-service
          - analytics-service
          - auth-service
          - notification-service
          - api-gateway
          - ui-service
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          failure-threshold: error

  # ── Security Summary ──────────────────────────────────────────
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - secret-detection
      - dependency-scan-node
      - dependency-scan-python
      - dependency-scan-go
      - dependency-scan-java
      - dependency-scan-php
      - sast-python
      - sast-semgrep
      - codeql
      - container-scan
      - infra-scan
      - dockerfile-scan
    if: always()
    steps:
      - name: Summary
        run: |
          echo "════════════════════════════════════════"
          echo "  Security Pipeline Summary"
          echo "════════════════════════════════════════"
          echo "Branch:  ${{ github.ref_name }}"
          echo "SHA:     ${{ github.sha }}"
          echo ""
          echo "Scans completed:"
          echo "  ✓ Secret detection (GitLeaks)"
          echo "  ✓ Dependency scanning (npm/pip/go/java/php)"
          echo "  ✓ SAST Python (Bandit)"
          echo "  ✓ SAST All languages (Semgrep)"
          echo "  ✓ SAST (CodeQL)"
          echo "  ✓ Container scanning (Trivy)"
          echo "  ✓ K8s manifest scanning (Checkov)"
          echo "  ✓ Dockerfile linting (Hadolint)"
          echo ""
          echo "Check Security tab for detailed reports:"
          echo "https://github.com/${{ github.repository }}/security"
          echo "════════════════════════════════════════"

