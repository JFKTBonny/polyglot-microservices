name: Reusable Python CI

on:
  workflow_call:
    inputs:
      service-dir:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.12'
      push-to-docker:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ${{ inputs.service-dir }}
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: ${{ inputs.service-dir }}
        run: |
          pip install flake8
          flake8 . \
            --max-line-length=120 \
            --exclude=__pycache__,myenv,.venv,venv,env,.env \
            || true

      - uses: docker/setup-buildx-action@v3
        if: inputs.push-to-docker

      - uses: docker/login-action@v3
        if: inputs.push-to-docker
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        if: inputs.push-to-docker
        with:
          context: ./${{ inputs.service-dir }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service-dir }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service-dir }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max