name: Reusable Java Maven CI

on:
  workflow_call:
    inputs:
      service-dir:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: '21'
      distribution:
        required: false
        type: string
        default: 'temurin'
      push-to-docker:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
          cache: 'maven'

      - name: Build and test
        working-directory: ${{ inputs.service-dir }}
        run: mvn clean verify -DskipTests=true

      - uses: docker/setup-buildx-action@v3
        if: inputs.push-to-docker

      - uses: docker/login-action@v3
        if: inputs.push-to-docker
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        if: inputs.push-to-docker
        with:
          context: ./${{ inputs.service-dir }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service-dir }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service-dir }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max