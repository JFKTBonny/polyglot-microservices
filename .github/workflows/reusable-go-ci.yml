name: Reusable Go CI

on:
  workflow_call:
    inputs:
      service-dir:
        required: true
        type: string
      go-version:
        required: false
        type: string
        default: '1.23'
      push-to-docker:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.service-dir }}/go.sum

      - name: Install dependencies
        working-directory: ${{ inputs.service-dir }}
        run: go mod download

      - name: Lint
        working-directory: ${{ inputs.service-dir }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ inputs.service-dir }}
        run: go test ./... || true

      - uses: docker/setup-buildx-action@v3
        if: inputs.push-to-docker

      - uses: docker/login-action@v3
        if: inputs.push-to-docker
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        if: inputs.push-to-docker
        with:
          context: ./${{ inputs.service-dir }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service-dir }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service-dir }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max