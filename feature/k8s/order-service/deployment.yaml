apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: polyglot
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: migrate
          image: mysql:8.0
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: DB_PASSWORD
          command:
            - sh
            - -c
            - |
              until mysql -h mysql-orders -P 3306 -u appuser orderdb -e "SELECT 1" > /dev/null 2>&1; do
                echo "waiting for mysql-orders..."
                sleep 3
              done
              mysql -h mysql-orders -P 3306 -u appuser orderdb -e "
                CREATE TABLE IF NOT EXISTS orders (
                  id         VARCHAR(36)   PRIMARY KEY,
                  user_id    VARCHAR(36)   NOT NULL,
                  status     VARCHAR(50)   NOT NULL DEFAULT 'pending',
                  total      DECIMAL(10,2) NOT NULL DEFAULT 0,
                  items      JSON          NOT NULL,
                  created_at TIMESTAMP     NOT NULL DEFAULT CURRENT_TIMESTAMP
                );
                CREATE INDEX IF NOT EXISTS idx_orders_user_id    ON orders(user_id);
                CREATE INDEX IF NOT EXISTS idx_orders_status     ON orders(status);
                CREATE INDEX IF NOT EXISTS idx_orders_created_at ON orders(created_at);
              "
              echo "migrations complete."
      containers:
        - name: order-service
          image: santonix/order-service:v1.0.0
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DB_HOST
              value: "mysql-orders"
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: DB_PORT_MYSQL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: DB_NAME_ORDERS
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: USER_SERVICE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: polyglot
spec:
  selector:
    app: order-service
  ports:
    - port: 3002
      targetPort: 3002