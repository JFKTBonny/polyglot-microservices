apiVersion: v1
kind: Secret
metadata:
  name: services-secrets
  namespace: polyglot
type: Opaque
stringData:
  # Database credentials
  DB_USER:     "appuser"
  DB_PASSWORD: "password"

  # Database names
  DB_NAME_USERS:     "userdb"
  DB_NAME_ORDERS:    "orderdb"
  DB_NAME_INVENTORY: "inventorydb"
  DB_NAME_PAYMENTS:  "paymentdb"
  DB_NAME_ANALYTICS: "analyticsdb"
  DB_NAME_AUTH:      "authdb"

  # Database URLs
  DATABASE_URL_USERS: "postgres://appuser:password@postgres-users:5432/userdb"

  # JWT Secret
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"

  # Laravel
  APP_KEY: "base64:2fl+Tsg4gJDmXcVLkYFwOkKBBs1JnTpKBWMYBs1JnTp="

  # MySQL root
  MYSQL_ROOT_PASSWORD: "rootpassword"

  # MariaDB root
  MARIADB_ROOT_PASSWORD: "rootpassword"