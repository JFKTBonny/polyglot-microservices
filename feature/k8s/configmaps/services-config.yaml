apiVersion: v1
kind: ConfigMap
metadata:
  name: services-config
  namespace: polyglot
data:
  # Service URLs — used by services to call each other
  USER_SERVICE_URL:      "http://user-service:3001"
  ORDER_SERVICE_URL:     "http://order-service:3002"
  INVENTORY_SERVICE_URL: "http://inventory-service:3003"
  PAYMENT_SERVICE_URL:   "http://payment-service:3004"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3005"
  AUTH_SERVICE_URL:      "http://auth-service:3006"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_GROUP_ID:           "polyglot-microservices"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

  # Ports
  USER_SERVICRTE_PORT:      "3001"
  ORDER_SERVICE_PO:     "3002"
  INVENTORY_SERVICE_PORT: "3003"
  PAYMENT_SERVICE_PORT:   "3004"
  ANALYTICS_SERVICE_PORT: "3005"
  AUTH_SERVICE_PORT:      "3006"
  DB_PORT_MYSQL:          "3306"
  DB_PORT_POSTGRES:       "5432"

  # Environment
  NODE_ENV:  "production"
  APP_ENV:   "production"
  GIN_MODE:  "release"
  PYTHONUNBUFFERED: 1 

# JWT Settings
JWT_ALGORITHM: "HS256"
JWT_EXPIRY_MINUTES: "30"
JWT_REFRESH_EXPIRY_DAYS: "7"