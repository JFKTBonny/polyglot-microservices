apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: polyglot
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: migrate
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: DB_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-users -U appuser -d userdb; do
                echo "waiting for postgres-users..."
                sleep 2
              done
              psql -h postgres-users -U appuser -d userdb -c "
                CREATE EXTENSION IF NOT EXISTS pgcrypto;
                CREATE TABLE IF NOT EXISTS users (
                  id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                  email      TEXT        NOT NULL UNIQUE,
                  name       TEXT        NOT NULL,
                  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
                );
                CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
              "
              echo "migrations complete."
      containers:
        - name: user-service
          image: santonix/user-service:v1.0.0
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: DATABASE_URL_USERS
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: polyglot
spec:
  selector:
    app: user-service
  ports:
    - port: 3001
      targetPort: 3001