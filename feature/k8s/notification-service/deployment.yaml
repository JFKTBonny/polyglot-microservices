apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: polyglot
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: santonix/notification-service:v1.0.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: PYTHONUNBUFFERED
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi